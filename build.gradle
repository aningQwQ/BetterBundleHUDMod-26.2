plugins {
    id 'dev.kikugie.loom-back-compat'
    id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = "better-bundle-mc${project.minecraft_version}-v${project.mod_version}"
}

tasks.withType(org.gradle.api.tasks.bundling.AbstractArchiveTask).configureEach {
    archiveVersion = ""
}

repositories {
    mavenCentral()
    maven {
        name = 'TerraformersMC'
        url = 'https://maven.terraformersmc.com/releases/'
    }
    maven {
        name = 'Cloth Config'
        url = 'https://maven.shedaniel.me/'
    }
}

configurations {
    embed
    compileOnly.extendsFrom embed
}

loom {
    splitEnvironmentSourceSets()
    accessWidenerPath = file("src/main/resources/better-bundle.accesswidener")

    mods {
        "better-bundle" {
            sourceSet sourceSets.main
            sourceSet sourceSets.client
        }
    }
}

dependencies {
    loomx.applyMojangMappings()
    minecraft "com.mojang:minecraft:${project.minecraft_version}"

    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"

    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

    // 配置界面（Cloth Config / AutoConfig）
    modImplementation("me.shedaniel.cloth:cloth-config-fabric:${project.cloth_config_version}") {
        exclude(group: "net.fabricmc.fabric-api")
    }
    // ModMenu 配置入口（可选依赖）
    modImplementation("com.terraformersmc:modmenu:${project.modmenu_version}") {
        exclude(group: "net.fabricmc.fabric-api")
    }

    embed 'com.belerweb:pinyin4j:2.5.1'
}

processResources {
    def version = project.version
    inputs.property "version", version

    filesMatching("fabric.mod.json") {
        expand "version": version
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 21
}

java {
    withSourcesJar()

    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

jar {
    def projectName = project.name
    inputs.property "projectName", projectName

    from("LICENSE") {
        rename { "${it}_$projectName"}
    }

    // Embed pinyin4j classes directly (not jar-in-jar)
    from {
        configurations.embed.collect { it.isDirectory() ? it : zipTree(it) }
    }
}

publishing {
    publications {
        create("mavenJava", MavenPublication) {
            from components.java
        }
    }

    repositories {
    }
}
